<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ショップ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: #f7f8fa;
  color: #1a1a1a;
  font-size: 14px;
  min-height: 100vh;
}

.page { display: none; }
.page.active { display: block; }

/* ===== メイン ===== */
.main { padding: 48px 40px; max-width: 900px; margin: 0 auto; }

/* ===== ホーム ===== */
#page-home {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 80px;
}
.home-search-wrap {
  display: flex;
  align-items: center;
  width: 560px;
  height: 48px;
  border: 1px solid #dfe1e5;
  border-radius: 28px;
  padding: 0 18px 0 22px;
  gap: 10px;
  background: #fff;
  box-shadow: 0 1px 6px rgba(32,33,36,0.12);
  margin-bottom: 40px;
  transition: box-shadow 0.2s;
}
.home-search-wrap:focus-within {
  box-shadow: 0 2px 10px rgba(59,130,246,0.18);
  border-color: #93c5fd;
}
.home-search-wrap .g-icon { font-size: 18px; color: #9aa0a6; flex-shrink: 0; }
.home-search-wrap input[type=text] {
  border: none; outline: none;
  font-size: 16px; flex: 1;
  background: transparent;
  color: #1a1a1a;
  font-family: inherit;
}
.home-search-wrap input[type=text]::placeholder { color: #aaa; }

.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 560px;
}
.home-card {
  background: #fff;
  border: 1px solid #e8e8e8;
  border-radius: 12px;
  padding: 28px 24px;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 140px;
}
.home-card:hover {
  box-shadow: 0 4px 16px rgba(59,130,246,0.10);
  border-color: #bfdbfe;
  transform: translateY(-2px);
}
.home-card-icon {
  font-size: 26px;
  width: 44px; height: 44px;
  background: #eff6ff;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.home-card-title { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.home-card-desc { font-size: 12px; color: #888; }

/* ===== 戻るボタン ===== */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 20px; padding: 7px 16px;
  border: 1px solid #e0e0e0; border-radius: 6px;
  background: #fff; cursor: pointer; font-size: 13px; color: #555;
  transition: background 0.15s;
}
.back-btn:hover { background: #f5f5f5; }

/* ===== ページヘッダー ===== */
.page-header { margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header p { font-size: 13px; color: #888; margin-top: 4px; }

/* ===== ツールバー ===== */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 16px; background: #fff;
  border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 16px;
}
.toolbar label { font-size: 12px; color: #888; white-space: nowrap; }
.toolbar select {
  border: 1px solid #e0e0e0; border-radius: 6px;
  padding: 6px 10px; font-size: 13px; background: #fafafa;
  color: #1a1a1a; outline: none;
}
.toolbar select:focus { border-color: #93c5fd; }
.toolbar button {
  border: 1px solid #e0e0e0; border-radius: 6px;
  padding: 6px 14px; font-size: 13px; background: #fafafa;
  color: #555; cursor: pointer; transition: background 0.15s;
}
.toolbar button:hover { background: #f0f0f0; }
.toolbar .sep { color: #e0e0e0; }

/* ===== Google風検索バー（各ページ内） ===== */
.google-search-wrap {
  display: flex; align-items: center; flex: 1; min-width: 240px;
  height: 40px; border: 1px solid #dfe1e5; border-radius: 24px;
  padding: 0 14px 0 18px; gap: 8px; background: #fff;
  box-shadow: 0 1px 4px rgba(32,33,36,0.1); transition: box-shadow 0.2s;
}
.google-search-wrap:focus-within {
  box-shadow: 0 2px 8px rgba(59,130,246,0.15); border-color: #93c5fd;
}
.google-search-wrap .g-icon { font-size: 16px; color: #9aa0a6; flex-shrink: 0; }
.google-search-wrap input[type=text] {
  border: none; outline: none; font-size: 14px; flex: 1;
  background: transparent; color: #1a1a1a; font-family: inherit;
}
.google-search-wrap input[type=text]::placeholder { color: #aaa; }

/* ===== テーブル ===== */
.table-wrap { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th {
  background: #f8f9fa; color: #555; padding: 10px 14px;
  text-align: left; font-weight: 600; font-size: 12px;
  white-space: nowrap; cursor: pointer; user-select: none;
  border-bottom: 1px solid #e8e8e8;
}
th:hover { background: #f0f4ff; color: #3b82f6; }
th .sort-icon { margin-left: 4px; opacity: 0.4; font-size: 10px; }
th.sorted .sort-icon { opacity: 1; color: #3b82f6; }
td {
  padding: 10px 14px; border-bottom: 1px solid #f0f0f0;
  font-size: 13px; vertical-align: middle; color: #1a1a1a;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafbff; }
.badge-sale {
  background: #fee2e2; color: #dc2626; font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 20px; margin-left: 6px;
}
.badge-genre {
  background: #f3f4f6; color: #555; font-size: 11px;
  padding: 2px 8px; border-radius: 20px; border: 1px solid #e5e7eb;
}
.count-info { font-size: 12px; color: #888; margin-bottom: 10px; }

/* ===== セール ===== */
.sale-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.live-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.sale-info { font-size: 12px; color: #aaa; }
</style>
</head>
<body>

<div class="main">

  <!-- ホーム -->
  <div class="page active" id="page-home">
    <div class="home-search-wrap">
      <span class="g-icon">🔍</span>
      <input type="text" id="home-search-input" placeholder="商品名を入力して検索…" oninput="homeSearch()">
    </div>
    <div class="home-grid">
      <div class="home-card" onclick="showPage('search')">
        <div class="home-card-icon">🔍</div>
        <div class="home-card-title">商品名から検索</div>
        <div class="home-card-desc">キーワードで商品を探す</div>
      </div>
      <div class="home-card" onclick="showPage('genre')">
        <div class="home-card-icon">📂</div>
        <div class="home-card-title">ジャンルから検索</div>
        <div class="home-card-desc">カテゴリで絞り込む</div>
      </div>
      <div class="home-card" onclick="showPage('ranking')">
        <div class="home-card-icon">⭐</div>
        <div class="home-card-title">おすすめ</div>
        <div class="home-card-desc">売上の多い人気商品</div>
      </div>
      <div class="home-card" onclick="showPage('sale')">
        <div class="home-card-icon">🏷️</div>
        <div class="home-card-title">セール中！</div>
        <div class="home-card-desc">お得な割引商品をチェック</div>
      </div>
    </div>
  </div>

  <!-- 商品名から検索 -->
  <div class="page" id="page-search">
    <button class="back-btn" onclick="showPage('home')">← ホームへ戻る</button>
    <div class="page-header"><h1>商品名から検索</h1></div>
    <div class="toolbar">
      <div class="google-search-wrap">
        <span class="g-icon">🔍</span>
        <input type="text" id="search-input" placeholder="商品名を入力" oninput="renderSearch()">
      </div>
      <span class="sep">|</span>
      <label>ジャンル</label>
      <select id="search-genre" onchange="renderSearch()"><option value="">すべて</option></select>
      <span class="sep">|</span>
      <label>並び替え</label>
      <select id="search-sort" onchange="renderSearch()">
        <option value="id-asc">商品番号 ↑</option>
        <option value="name-asc">商品名 A→Z</option>
        <option value="price-asc">価格 安い順</option>
        <option value="price-desc">価格 高い順</option>
        <option value="sales-desc">売上 多い順</option>
      </select>
      <button onclick="resetSearch()">リセット</button>
    </div>
    <div class="count-info" id="search-count"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="sortTable('search','id')">商品番号<span class="sort-icon">↕</span></th>
          <th onclick="sortTable('search','name')">商品名<span class="sort-icon">↕</span></th>
          <th onclick="sortTable('search','genre')">ジャンル<span class="sort-icon">↕</span></th>
          <th onclick="sortTable('search','price')">価格<span class="sort-icon">↕</span></th>
          <th onclick="sortTable('search','sales')">売上数<span class="sort-icon">↕</span></th>
          <th>セール</th>
        </tr></thead>
        <tbody id="search-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- セール中 -->
  <div class="page" id="page-sale">
    <button class="back-btn" onclick="showPage('home')">← ホームへ戻る</button>
    <div class="sale-header">
      <div class="live-dot"></div>
      <h1 style="font-size:20px;font-weight:700">セール中の商品</h1>
      <span class="sale-info" id="sale-updated"></span>
    </div>
    <div class="toolbar">
      <label>ジャンル</label>
      <select id="sale-genre" onchange="renderSale()"><option value="">すべて</option></select>
      <span class="sep">|</span>
      <label>並び替え</label>
      <select id="sale-sort" onchange="renderSale()">
        <option value="discount-desc">割引率 高い順</option>
        <option value="price-asc">価格 安い順</option>
        <option value="sales-desc">売上 多い順</option>
      </select>
    </div>
    <div class="count-info" id="sale-count"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>商品番号</th><th>商品名</th><th>ジャンル</th>
          <th>通常価格</th><th>セール価格</th><th>割引率</th><th>売上数</th>
        </tr></thead>
        <tbody id="sale-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ジャンル別 -->
  <div class="page" id="page-genre">
    <button class="back-btn" onclick="showPage('home')">← ホームへ戻る</button>
    <div class="page-header"><h1>ジャンルから検索</h1></div>
    <div class="toolbar">
      <label>ジャンルを選択</label>
      <select id="genre-select" onchange="renderGenre()"><option value="">すべて表示</option></select>
      <span class="sep">|</span>
      <label>並び替え</label>
      <select id="genre-sort" onchange="renderGenre()">
        <option value="id-asc">商品番号 ↑</option>
        <option value="price-asc">価格 安い順</option>
        <option value="price-desc">価格 高い順</option>
        <option value="sales-desc">売上 多い順</option>
      </select>
    </div>
    <div id="genre-sections"></div>
  </div>

  <!-- 売上ランキング -->
  <div class="page" id="page-ranking">
    <button class="back-btn" onclick="showPage('home')">← ホームへ戻る</button>
    <div class="page-header">
      <h1>おすすめ</h1>
      <p>売上順のランキング</p>
    </div>
    <div class="toolbar">
      <label>ジャンル</label>
      <select id="rank-genre" onchange="renderRanking()"><option value="">すべて</option></select>
      <span class="sep">|</span>
      <label>表示件数</label>
      <select id="rank-limit" onchange="renderRanking()">
        <option value="10">10件</option>
        <option value="20">20件</option>
        <option value="50">50件</option>
        <option value="999">全件</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>順位</th><th>商品番号</th><th>商品名</th>
          <th>ジャンル</th><th>価格</th><th>売上数</th><th>売上金額</th>
        </tr></thead>
        <tbody id="rank-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const GENRES = ['家電','ファッション','食品','書籍','スポーツ','インテリア','コスメ','おもちゃ'];
const SALE_RATES = [0, 0, 0, 0.1, 0.15, 0.2, 0.25, 0.3, 0.5];

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

const PRODUCTS = Array.from({length: 80}, (_, i) => {
  const genre = GENRES[i % GENRES.length];
  const basePrice = rand(500, 50000);
  const saleRate = SALE_RATES[rand(0, SALE_RATES.length - 1)];
  const salePrice = saleRate > 0 ? Math.floor(basePrice * (1 - saleRate)) : null;
  return {
    id: `P${String(i + 1).padStart(4, '0')}`,
    name: `${genre}商品 ${String(i + 1).padStart(3, '0')}`,
    genre, price: basePrice, salePrice, saleRate,
    sales: rand(0, 3000), isSale: saleRate > 0,
  };
});

function updateSaleTime() {
  const now = new Date();
  const f = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')} 更新`;
  const el = document.getElementById('sale-updated');
  if (el) el.textContent = f;
}
setInterval(updateSaleTime, 1000);
updateSaleTime();

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  renderAll();
}

// ホーム検索バーから商品名検索ページへ
function homeSearch() {
  const val = document.getElementById('home-search-input').value;
  if (val.trim()) {
    showPage('search');
    document.getElementById('search-input').value = val;
    renderSearch();
  }
}

function initSelects() {
  ['search-genre','sale-genre','genre-select','rank-genre'].forEach(id => {
    const sel = document.getElementById(id);
    const first = sel.options[0];
    sel.innerHTML = '';
    sel.appendChild(first);
    GENRES.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      sel.appendChild(opt);
    });
  });
}
initSelects();

const sortState = { search: { key: 'id', asc: true } };

function sortTable(table, key) {
  if (sortState[table].key === key) sortState[table].asc = !sortState[table].asc;
  else { sortState[table].key = key; sortState[table].asc = true; }
  if (table === 'search') renderSearch();
}

function applySort(arr, key, asc) {
  return [...arr].sort((a, b) => {
    let va = a[key], vb = b[key];
    if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
    return asc ? va - vb : vb - va;
  });
}

function fmt(n) { return n.toLocaleString('ja-JP') + '円'; }

function resetSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-genre').value = '';
  document.getElementById('search-sort').value = 'id-asc';
  renderSearch();
}

function renderSearch() {
  const kw = document.getElementById('search-input').value.toLowerCase();
  const genre = document.getElementById('search-genre').value;
  const sortVal = document.getElementById('search-sort').value;
  const [sKey, sDir] = sortVal.split('-');
  let data = PRODUCTS.filter(p => (!kw || p.name.toLowerCase().includes(kw)) && (!genre || p.genre === genre));
  const keyMap = { id: 'id', name: 'name', price: 'price', sales: 'sales', genre: 'genre' };
  data = applySort(data, keyMap[sKey] || 'id', sDir !== 'desc');
  document.getElementById('search-count').textContent = `${data.length}件`;
  document.getElementById('search-tbody').innerHTML = data.map(p => `
    <tr>
      <td>${p.id}</td>
      <td>${p.name}${p.isSale ? '<span class="badge-sale">SALE</span>' : ''}</td>
      <td><span class="badge-genre">${p.genre}</span></td>
      <td>${fmt(p.price)}</td>
      <td>${p.sales.toLocaleString()}</td>
      <td>${p.isSale ? `<span style="color:#dc2626;font-weight:600">${(p.saleRate*100).toFixed(0)}%OFF</span>` : '―'}</td>
    </tr>
  `).join('');
}

function renderSale() {
  const genre = document.getElementById('sale-genre').value;
  const sortVal = document.getElementById('sale-sort').value;
  let data = PRODUCTS.filter(p => p.isSale && (!genre || p.genre === genre));
  if (sortVal === 'discount-desc') data.sort((a,b) => b.saleRate - a.saleRate);
  else if (sortVal === 'price-asc') data.sort((a,b) => a.salePrice - b.salePrice);
  else if (sortVal === 'sales-desc') data.sort((a,b) => b.sales - a.sales);
  document.getElementById('sale-count').textContent = `${data.length}件のセール商品`;
  document.getElementById('sale-tbody').innerHTML = data.map(p => `
    <tr>
      <td>${p.id}</td><td>${p.name}</td>
      <td><span class="badge-genre">${p.genre}</span></td>
      <td style="text-decoration:line-through;color:#aaa">${fmt(p.price)}</td>
      <td style="color:#dc2626;font-weight:700">${fmt(p.salePrice)}</td>
      <td style="color:#dc2626;font-weight:600">${(p.saleRate*100).toFixed(0)}%OFF</td>
      <td>${p.sales.toLocaleString()}</td>
    </tr>
  `).join('');
}

function renderGenre() {
  const selected = document.getElementById('genre-select').value;
  const sortVal = document.getElementById('genre-sort').value;
  const [sKey, sDir] = sortVal.split('-');
  const keyMap = { id: 'id', price: 'price', sales: 'sales' };
  const genres = selected ? [selected] : GENRES;
  const container = document.getElementById('genre-sections');
  container.innerHTML = '';
  genres.forEach(g => {
    let data = PRODUCTS.filter(p => p.genre === g);
    data = applySort(data, keyMap[sKey] || 'id', sDir !== 'desc');
    const section = document.createElement('div');
    section.style.marginBottom = '28px';
    section.innerHTML = `
      <div style="font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:10px">
        ${g} <span style="font-size:12px;font-weight:400;color:#888">（${data.length}件）</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>商品番号</th><th>商品名</th><th>価格</th><th>売上数</th><th>セール</th></tr></thead>
          <tbody>${data.map(p => `
            <tr>
              <td>${p.id}</td>
              <td>${p.name}${p.isSale ? '<span class="badge-sale">SALE</span>' : ''}</td>
              <td>${fmt(p.price)}</td>
              <td>${p.sales.toLocaleString()}</td>
              <td>${p.isSale ? `<span style="color:#dc2626;font-weight:600">${(p.saleRate*100).toFixed(0)}%OFF → ${fmt(p.salePrice)}` : '―'}</td>
            </tr>
          `).join('')}</tbody>
        </table>
      </div>
    `;
    container.appendChild(section);
  });
}

function renderRanking() {
  const genre = document.getElementById('rank-genre').value;
  const limit = parseInt(document.getElementById('rank-limit').value);
  let data = PRODUCTS.filter(p => !genre || p.genre === genre);
  data.sort((a, b) => b.sales - a.sales);
  data = data.slice(0, limit);
  document.getElementById('rank-tbody').innerHTML = data.map((p, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;
    return `
      <tr>
        <td style="text-align:center;font-weight:bold">${medal}</td>
        <td>${p.id}</td>
        <td>${p.name}${p.isSale ? '<span class="badge-sale">SALE</span>' : ''}</td>
        <td><span class="badge-genre">${p.genre}</span></td>
        <td>${fmt(p.isSale ? p.salePrice : p.price)}</td>
        <td>${p.sales.toLocaleString()}</td>
        <td>${fmt((p.isSale ? p.salePrice : p.price) * p.sales)}</td>
      </tr>
    `;
  }).join('');
}

function renderAll() {
  renderSearch(); renderSale(); renderGenre(); renderRanking();
}
renderAll();
</script>
</body>
</html>
