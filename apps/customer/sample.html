<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店舗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

 body {
    background: #fff;
    font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 40px;
    min-height: 100vh;
  }

  h1 {
    font-size: 36px;
    font-weight: 700;
    border: 2px solid #000;
    padding: 8px 40px;
    margin-bottom: 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 800px;
  }

  .box {
    border: 1px solid #000;
    padding: 20px;
    min-height: 200px;
    font-size: 22px;
    font-weight: 400;
    vertical-align: top;
  }

</style>
</head>
<body>

	<h1>ホーム</h1>

	<div class="grid">
    		<div class="box">商品名<br>から検索</div>
    		<div class="box">ジャンル<br>から検索</div>
    		<div class="box">売上順</div>
    		<div class="box">セール中商品一覧</div>
  	</div>

</body>
</html>
