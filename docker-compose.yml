services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: store_product_lookup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  app:
    build:
      context: .
      dockerfile: services/Dockerfile
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: store_product_lookup
      MODEL_PATH: /app/model/quantized/ruri-v3-310m
      FRONT_PATH: /app/front
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
