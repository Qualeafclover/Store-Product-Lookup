<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ショップ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: #f7f8fa;
  color: #1a1a1a;
  font-size: 14px;
  min-height: 100vh;
}

.page { display: none; }
.page.active { display: block; }

/* ===== メイン ===== */
.main { padding: 48px 40px; max-width: 900px; margin: 0 auto; }

/* ===== ホーム ===== */
#page-home {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 80px;
}
.home-search-wrap {
  display: flex;
  align-items: center;
  width: 560px;
  height: 48px;
  border: 1px solid #dfe1e5;
  border-radius: 28px;
  padding: 0 18px 0 22px;
  gap: 10px;
  background: #fff;
  box-shadow: 0 1px 6px rgba(32,33,36,0.12);
  margin-bottom: 40px;
  transition: box-shadow 0.2s;
}
.home-search-wrap:focus-within {
  box-shadow: 0 2px 10px rgba(59,130,246,0.18);
  border-color: #93c5fd;
}
.home-search-wrap .g-icon { font-size: 18px; color: #9aa0a6; flex-shrink: 0; }
.home-search-wrap input[type=text] {
  border: none; outline: none;
  font-size: 16px; flex: 1;
  background: transparent;
  color: #1a1a1a;
  font-family: inherit;
}
.home-search-wrap input[type=text]::placeholder { color: #aaa; }
.home-search-wrap .g-mic { font-size: 18px; color: #3b82f6; flex-shrink: 0; }

.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 560px;
}
.home-card {
  background: #fff;
  border: 1px solid #e8e8e8;
  border-radius: 12px;
  padding: 28px 24px;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 140px;
}
.home-card:hover {
  box-shadow: 0 4px 16px rgba(59,130,246,0.10);
  border-color: #bfdbfe;
  transform: translateY(-2px);
}
.home-card-icon {
  font-size: 26px;
  width: 44px; height: 44px;
  background: #eff6ff;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.home-card-title { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.home-card-desc { font-size: 12px; color: #888; }

/* ===== 戻るボタン ===== */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 20px; padding: 7px 16px;
  border: 1px solid #e0e0e0; border-radius: 6px;
  background: #fff; cursor: pointer; font-size: 13px; color: #555;
  transition: background 0.15s;
}
.back-btn:hover { background: #f5f5f5; }

/* ===== ページヘッダー ===== */
.page-header { margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header p { font-size: 13px; color: #888; margin-top: 4px; }

/* ===== ツールバー ===== */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 16px; background: #fff;
  border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 16px;
}
.toolbar label { font-size: 12px; color: #888; white-space: nowrap; }
.toolbar select {
  border: 1px solid #e0e0e0; border-radius: 6px;
  padding: 6px 10px; font-size: 13px; background: #fafafa;
  color: #1a1a1a; outline: none;
}
.toolbar select:focus { border-color: #93c5fd; }
.toolbar button {
  border: 1px solid #e0e0e0; border-radius: 6px;
  padding: 6px 14px; font-size: 13px; background: #fafafa;
  color: #555; cursor: pointer; transition: background 0.15s;
}
.toolbar button:hover { background: #f0f0f0; }
.toolbar .sep { color: #e0e0e0; }

/* ===== Google風検索バー（各ページ内） ===== */
.google-search-wrap {
  display: flex; align-items: center; flex: 1; min-width: 240px;
  height: 40px; border: 1px solid #dfe1e5; border-radius: 24px;
  padding: 0 14px 0 18px; gap: 8px; background: #fff;
  box-shadow: 0 1px 4px rgba(32,33,36,0.1); transition: box-shadow 0.2s;
}
.google-search-wrap:focus-within {
  box-shadow: 0 2px 8px rgba(59,130,246,0.15); border-color: #93c5fd;
}
.google-search-wrap .g-icon { font-size: 16px; color: #9aa0a6; flex-shrink: 0; }
.google-search-wrap input[type=text] {
  border: none; outline: none; font-size: 14px; flex: 1;
  background: transparent; color: #1a1a1a; font-family: inherit;
}
.google-search-wrap input[type=text]::placeholder { color: #aaa; }
.google-search-wrap .g-mic { font-size: 16px; color: #3b82f6; flex-shrink: 0; }

/* ===== テーブル ===== */
.table-wrap { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th {
  background: #f8f9fa; color: #555; padding: 10px 14px;
  text-align: left; font-weight: 600; font-size: 12px;
  white-space: nowrap;
  border-bottom: 1px solid #e8e8e8;
}
td {
  padding: 10px 14px; border-bottom: 1px solid #f0f0f0;
  font-size: 13px; vertical-align: middle; color: #1a1a1a;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafbff; }
.badge-genre {
  background: #f3f4f6; color: #555; font-size: 11px;
  padding: 2px 8px; border-radius: 20px; border: 1px solid #e5e7eb;
}
.count-info { font-size: 12px; color: #888; margin-bottom: 10px; }


/* ===== ローディングスピナー ===== */
#loading {
  display: none;
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.85);
  z-index: 999;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid #e0e0e0;
  border-top-color: #3b82f6;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== エラーメッセージ ===== */
#load-error {
  display: none;
  background: #fee2e2; border: 1px solid #fca5a5;
  border-radius: 8px; padding: 12px 16px;
  margin-bottom: 16px; font-size: 13px; color: #dc2626;
}

/* ===== スマートフォン対応 ===== */
@media (max-width: 600px) {
  #page-home { padding-top: 40px; }
  .home-search-wrap { width: 100%; }
  .home-grid { width: 100%; grid-template-columns: 1fr; }
  #home-results { width: 100%; }
  .main { padding: 24px 16px; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
  .toolbar .sep { display: none; }
  .google-search-wrap { min-width: unset; width: 100%; }
  table { font-size: 11px; }
  td, th { padding: 8px 8px; }
  .back-btn { font-size: 12px; }
  .page-header h1 { font-size: 18px; }

}

</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;color:#888">商品データを読み込み中…</div>
</div>

<div class="main">

  <!-- <div id="load-error">⚠️ 商品データの取得に失敗しました。サーバーの接続を確認してください。</div>
  <div id="not-found-error">⚠️ 商品データが見つかりませんでした (404)。</div> -->

  <!-- ホーム -->
  <div class="page active" id="page-home">
    <div class="home-search-wrap">
      <span class="g-icon">🔍</span>
      <input type="text" id="home-search-input" placeholder="商品名を入力して検索…" onkeydown="homeSearch(event)">
    </div>

    <!-- <div class="home-grid" id="home-grid">
      <div class="home-card" onclick="showPage('search')">
        <div class="home-card-icon">🔍</div>
        <div class="home-card-title">商品名から検索</div>
        <div class="home-card-desc">キーワードで商品を探す</div>
      </div>
      <div class="home-card" onclick="showPage('genre')">
        <div class="home-card-icon">📂</div>
        <div class="home-card-title">場所から検索</div>
        <div class="home-card-desc">場所で絞り込む</div>
      </div>

    </div> -->

  </div>

  <!-- 商品名から検索 -->
  <div class="page" id="page-search">
    <button class="back-btn" onclick="showPage('home')"> 一覧を消す</button>
    <div class="page-header"><h1>商品名から検索</h1></div>
    <div class="toolbar" style="display:none">
      <div class="google-search-wrap">
        <span class="g-icon">🔍</span>
        <input type="text" id="search-input" placeholder="商品名を入力" oninput="fetchSearchResults()">
        <span class="g-mic">🎤</span>
      </div>
      <span class="sep">|</span>
      <label>場所</label>
      <select id="search-genre" onchange="renderSearch()"><option value="">すべて</option></select>
      <button onclick="resetSearch()">リセット</button>
    </div>
    <div class="count-info" id="search-count"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>商品名</th>
          <th>場所</th>
          <th>価格</th>
          <th>詳細</th>
        </tr></thead>
        <tbody id="search-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 場所から検索 -->
  <div class="page" id="page-genre">
    <button class="back-btn" onclick="showPage('home')"> 一覧を消す</button>
    <div class="page-header"><h1>場所から検索</h1></div>
    <div class="toolbar">
      <label>場所を選択</label>
      <select id="genre-select" onchange="renderGenre()"><option value="">すべて表示</option></select>
    </div>
    <div id="genre-sections"></div>
  </div>


</div><!-- /main -->

<script>
let PRODUCTS = [];
let GENRES = [];


function normalizeProduct(item, index) {
  return {
    id:      item.id ?? index,
    name:    item.name    ?? '不明',
    description:   item.description        ?? item.genre ?? '未分類',
    aisle_id:  item.id_aisle      ?? 0,
    aisle_name:   item.aisle_name  ?? '不明',
    price:   Number(item.price)   || 0,
  };
}
//バックエンドの仕様によって変更

// async function loadProducts() {
//   document.getElementById('loading').style.display = 'flex';
//   try {
//     const res = await fetch('/api/customer/search', {
//       method: 'GET',
//       headers: { 'Content-Type': 'application/json' }
//     });
//     const data = await res.json();
//     PRODUCTS = (Array.isArray(data) ? data : data.products ?? [])
//       .map((item, i) => normalizeProduct(item, i));
//     GENRES = [...new Set(PRODUCTS.map(p => p.aisle_name))];
//   } catch (e) {
//     console.error('商品データの取得に失敗しました:', e);
//     document.getElementById('load-error').style.display = 'block';
//   } finally {
//     document.getElementById('loading').style.display = 'none';
//     initSelects();
//     renderAll();
//   }
// }

// 追加: 全商品を読み込む代わりに、入力されたキーワードのみをサーバーに送り、
// データベース側で絞り込んだ結果だけを受け取るための関数
// 変更: 場所(location)も指定できるように拡張(場所から検索ページで使用)
async function fetchSearchResults(keyword, location) {
  // const params = new URLSearchParams();
  // if (keyword)  params.set('keyword', keyword);   // 入力されたキーワードのみを送信
  // if (location) params.set('location', location); // 選択された場所のみを送信

  // ※ /api/customer/search は検索専用のエンドポイントを想定しています。
  //   実際のバックエンドのパス・パラメータ名に合わせて変更してください。
  const input = document.getElementById('home-search-input').value;
  const res = await fetch(`/api/customer/search`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sentence: input })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(res.status);

  return (Array.isArray(data) ? data : data.products ?? [])
    .map((item, i) => normalizeProduct(item, i));
}
// 追加ここまで

// ===== ページ切り替え =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (id === 'home') document.getElementById('home-search-input').value = '';
  renderAll();
}

// ===== ホーム検索 =====
function homeSearch(e) {
  if (e && e.key !== 'Enter') return;
  const kw = document.getElementById('home-search-input').value.trim();
  if (!kw) return;
  document.getElementById('search-input').value = kw;
  showPage('search');
}

// ===== セレクト初期化 =====
function initSelects() {
  ['search-genre','genre-select'].forEach(id => {
    const sel = document.getElementById(id);
    const first = sel.options[0];
    sel.innerHTML = '';
    sel.appendChild(first);
    GENRES.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      sel.appendChild(opt);
    });
  });
}

function fmt(n) { return Number(n).toLocaleString('ja-JP') + '円'; }

// ===== 商品名検索 =====
function resetSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-genre').value = '';
  renderSearch();
}

// 変更: PRODUCTS配列を絞り込む方式から、キーワードのみをサーバーへ送って
// データベース側の検索結果だけを受け取る方式に変更(場所の絞り込みはクライアント側のまま)
async function renderSearch() {
  const kw = document.getElementById('search-input').value.trim();
  const genre = document.getElementById('search-genre').value;

  document.getElementById('loading').style.display = 'flex'; // 追加: 検索中はローディング表示
  try {
    // 変更: キーワードのみをDBに送信し、検索結果だけを取得
    let data = await fetchSearchResults(kw);

    // 場所での絞り込みは受け取った検索結果に対してクライアント側で行う
    if (genre) data = data.filter(p => p.aisle_name === genre);

    document.getElementById('search-count').textContent = `${data.length}件`;
    document.getElementById('search-tbody').innerHTML = data.map(p => `
      <tr>
        <td>${p.name}</td>
        <td><span class="badge-genre">${p.aisle_name}</span></td>
        <td>${fmt(p.price)}</td>
        <td style="color:#888;font-size:12px">${p.description}</td>
      </tr>
    `).join('');
  } catch (e) { // 追加: 検索リクエスト失敗時のエラー処理
    console.error('検索結果の取得に失敗しました:', e);
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('search-count').textContent = '';
    document.getElementById('search-tbody').innerHTML = '';
  } finally {
    document.getElementById('loading').style.display = 'none'; // 追加
  }
}

// ===== 場所別 =====
// 変更: PRODUCTS配列をクライアント側で絞り込む方式から、
// 場所(location)をサーバーに送ってDBが絞り込んだ結果だけを受け取る方式に変更
async function renderGenre() {
  const selected = document.getElementById('genre-select').value;
  const genres = selected ? [selected] : GENRES;
  const container = document.getElementById('genre-sections');

  document.getElementById('loading').style.display = 'flex'; // 追加: 取得中はローディング表示
  try {
    // 変更: 場所ごとにDBへ問い合わせて、その場所の商品だけを取得する
    const results = await Promise.all(
      genres.map(g => fetchSearchResults('', g))
    );

    container.innerHTML = '';
    genres.forEach((g, i) => {
      const data = results[i];
      const section = document.createElement('div');
      section.style.marginBottom = '28px';
      section.innerHTML = `
        <div style="font-size:14px;font-weight:700;color:#1a1a1a;margin-bottom:10px">
          ${g} <span style="font-size:12px;font-weight:400;color:#888">（${data.length}件）</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>商品名</th><th>価格</th><th>詳細</th></tr></thead>
            <tbody>${data.map(p => `
              <tr>
                <td>${p.name}</td>
                <td>${fmt(p.price)}</td>
                <td style="color:#888;font-size:12px">${p.description}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
      `;
      container.appendChild(section);
    });
  } catch (e) { // 追加: 取得失敗時のエラー処理
    console.error('場所別の商品取得に失敗しました:', e);
    document.getElementById('load-error').style.display = 'block';
    container.innerHTML = '';
  } finally {
    document.getElementById('loading').style.display = 'none'; // 追加
  }
}


// ===== renderAll =====
function renderAll() {
  renderSearch();
  renderGenre();
}

// loadProducts();
</script>
</body>
</html>
